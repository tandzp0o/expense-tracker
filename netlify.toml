[build]
  base    = "fe"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION          = "18"
  DISABLE_ESLINT_PLUGIN = "true"
  CI                    = "false"

# Redirects live in fe/public/_redirects, not here. Rules in netlify.toml win
# over that file, so a catch-all here would shadow the domain redirect and it
# would silently never fire.
